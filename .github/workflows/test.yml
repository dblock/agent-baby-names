name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.entry.os }})
    runs-on: ${{ matrix.entry.os }}
    strategy:
      fail-fast: false
      matrix:
        entry:
          - { os: ubuntu-24.04, test: test }
          - { os: macos-15, test: test }
          - { os: windows-2025, test: 'coverage:windows' }
    defaults:
      run:
        shell: bash
    steps:
      - name: Check Out
        uses: actions/checkout@v7.0.1
      - name: Set Up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Run Tests
        run: npm run ${{ matrix.entry.test }}
  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - name: Check Out
        uses: actions/checkout@v7.0.1
      - name: Set Up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Measure Coverage
        run: npm run coverage
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage
          path: coverage/
